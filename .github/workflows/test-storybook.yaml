name: Test (Storybook)

on:
    push:
        branches:
            - main

    pull_request:
        types:
            - opened
            - synchronize
            - reopened

concurrency:
    group: test-storybook-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test-storybook:
        timeout-minutes: 30
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  cache: npm
                  node-version-file: .nvmrc

            - name: Set up npm
              run: npm install --global npm@12.0.2

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build Storybook workspace
              run: npm run build -- --filter=@krudi/storybook...

            - name: Resolve Playwright version
              id: playwright-version
              shell: bash
              run: |
                  version="$(node -p 'require("playwright/package.json").version')"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Restore Playwright browser cache
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
              with:
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
                  path: ~/.cache/ms-playwright

            - name: Install Playwright browsers
              run: npm exec -- playwright install --with-deps chromium

            - name: Run Storybook tests
              run: npm run test:storybook
