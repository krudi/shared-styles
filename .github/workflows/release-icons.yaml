name: Release (@krudi/icons)

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version without the package tag prefix'
                required: true
                type: string
            create_latest:
                description: 'Mark the GitHub release as latest'
                required: true
                default: true
                type: boolean

concurrency:
    group: release-icons-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release:
        permissions:
            contents: write
            id-token: write
        uses: ./.github/workflows/release-package.yaml
        with:
            package: '@krudi/icons'
            directory: packages/icons
            version: ${{ inputs.version }}
            create_latest: ${{ inputs.create_latest }}
        secrets:
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
