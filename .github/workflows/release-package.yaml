name: Release package

on:
    workflow_call:
        inputs:
            package:
                required: true
                type: string
            directory:
                required: true
                type: string
            version:
                required: true
                type: string
            create_latest:
                required: true
                type: boolean
        secrets:
            NPM_TOKEN:
                required: true

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Validate release input
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                    echo "Releases run only from main, not '$GITHUB_REF'."
                    exit 1
                  fi
                  if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                    echo "Version must be a semantic version like 0.5.0 or 0.5.0-beta.1."
                    exit 1
                  fi

    release:
        needs: validate
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  cache: npm
                  node-version-file: .nvmrc

            - name: Read current package metadata
              id: package-meta
              shell: bash
              env:
                  PACKAGE: ${{ inputs.package }}
                  DIRECTORY: ${{ inputs.directory }}
                  NEW_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  OLD_VERSION="$(node -p "require('./${DIRECTORY}/package.json').version")"
                  TAG_NAME="${PACKAGE}@${NEW_VERSION}"
                  if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
                    echo "Version ${NEW_VERSION} is already set in ${DIRECTORY}/package.json."
                    exit 1
                  fi
                  echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

            - name: Ensure release tag does not exist
              shell: bash
              env:
                  TAG_NAME: ${{ steps.package-meta.outputs.tag }}
              run: |
                  set -euo pipefail
                  git fetch --tags origin
                  if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
                    echo "Tag '$TAG_NAME' already exists locally."
                    exit 1
                  fi
                  if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
                    echo "Tag '$TAG_NAME' already exists on origin."
                    exit 1
                  fi

            - name: Bump package version
              shell: bash
              env:
                  PACKAGE: ${{ inputs.package }}
                  NEW_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  npm version "$NEW_VERSION" --workspace="$PACKAGE" --no-git-tag-version

            - name: Verify release file version
              shell: bash
              env:
                  DIRECTORY: ${{ inputs.directory }}
                  NEW_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  ACTUAL_VERSION="$(node -p "require('./${DIRECTORY}/package.json').version")"
                  if [ "$ACTUAL_VERSION" != "$NEW_VERSION" ]; then
                    echo "Expected ${DIRECTORY}/package.json version '$NEW_VERSION' but found '$ACTUAL_VERSION'."
                    exit 1
                  fi

            - name: Ensure only expected files changed
              shell: bash
              env:
                  DIRECTORY: ${{ inputs.directory }}
              run: |
                  set -euo pipefail
                  mapfile -t changed_files < <(git status --porcelain | awk '{print $2}')
                  if [ ${#changed_files[@]} -eq 0 ]; then
                    echo "No files changed after version bump."
                    exit 1
                  fi
                  for file in "${changed_files[@]}"; do
                    if [ "$file" != "${DIRECTORY}/package.json" ] && [ "$file" != "package-lock.json" ]; then
                      echo "Unexpected changed file after version bump: $file"
                      exit 1
                    fi
                  done

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build package
              run: npm run build -- --filter="${{ inputs.package }}..."

            - name: Typecheck package
              run: npm run typecheck -- --filter="${{ inputs.package }}..."

            - name: Lint
              run: npm run lint

            - name: Check package contents
              run: npm pack --dry-run --workspace="${{ inputs.package }}"

            - name: Commit version bump and tag locally
              shell: bash
              env:
                  PACKAGE: ${{ inputs.package }}
                  DIRECTORY: ${{ inputs.directory }}
                  OLD_VERSION: ${{ steps.package-meta.outputs.old_version }}
                  NEW_VERSION: ${{ inputs.version }}
                  TAG_NAME: ${{ steps.package-meta.outputs.tag }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "${DIRECTORY}/package.json" package-lock.json
                  git commit -m "chore(release): bump ${PACKAGE} from ${OLD_VERSION} to ${NEW_VERSION}"
                  git tag "$TAG_NAME"
                  git push --dry-run --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${TAG_NAME}"

            - name: Configure npm auth
              shell: bash
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm config set "//registry.npmjs.org/:_authToken" "$NODE_AUTH_TOKEN"

            - name: Publish package
              run: npm publish --workspace="${{ inputs.package }}" --access public --provenance

            - name: Push version bump and tag
              shell: bash
              env:
                  TAG_NAME: ${{ steps.package-meta.outputs.tag }}
              run: |
                  set -euo pipefail
                  git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${TAG_NAME}"

            - name: Create GitHub release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ steps.package-meta.outputs.tag }}
                  CREATE_LATEST: ${{ inputs.create_latest }}
              run: |
                  set -euo pipefail
                  LATEST_FLAG="--latest=false"
                  if [ "$CREATE_LATEST" = "true" ]; then
                    LATEST_FLAG="--latest"
                  fi
                  gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes $LATEST_FLAG
