name: CI

on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  cache: npm
                  node-version-file: .nvmrc

            - name: Set up npm
              run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Lint
              if: ${{ !cancelled() }}
              run: npm run lint:ox

            - name: Format
              if: ${{ !cancelled() }}
              run: npm run format:ox:check

            - name: Typecheck
              if: ${{ !cancelled() }}
              run: npm run typecheck

            - name: Knip
              if: ${{ !cancelled() }}
              run: npm run knip

            - name: Build
              if: ${{ !cancelled() }}
              run: npm run build

            - name: Resolve Playwright version
              if: ${{ !cancelled() }}
              id: playwright-version
              shell: bash
              run: |
                  version="$(node -p 'require("playwright/package.json").version')"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Restore Playwright browser cache
              if: ${{ !cancelled() }}
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
              with:
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
                  path: ~/.cache/ms-playwright

            - name: Install Playwright browsers
              if: ${{ !cancelled() }}
              run: npm exec -- playwright install --with-deps chromium

            - name: Storybook tests
              if: ${{ !cancelled() }}
              run: npm run test:storybook
